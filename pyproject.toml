[project]
name = "webmonitor"
version = "0.2.0"
description = "Watch specific elements of web pages and get notified the moment they change."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Dominik Harbich" }]
keywords = ["monitoring", "scraping", "web", "notifications", "qt"]

dependencies = [
    # GUI + embedded Chromium (QtWebEngine arrives via PySide6-Addons).
    "PySide6>=6.9,<7",
    # HTTP/2 + connection pooling + async. h2 extra enables multiplexing.
    "httpx[http2]>=0.28,<0.29",
    # Lexbor-backed HTML parser: ~10x faster than BeautifulSoup + html.parser.
    "selectolax>=0.3.21",
    # OS-native credential storage (Windows Credential Manager / Keychain / SecretService).
    "keyring>=25,<26",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
webmonitor = "webmonitor.__main__:main"

[project.gui-scripts]
webmonitor-gui = "webmonitor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webmonitor"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "D",         # pydocstyle (PEP 257)
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "TCH",       # type-checking blocks
    "ANN",       # missing annotations
    "RUF",
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "ANN401", # allow typing.Any where genuinely dynamic
    # TC001/TC003 want runtime imports moved into `if TYPE_CHECKING`. That is
    # actively wrong here: pydantic models and dataclasses resolve their
    # annotations at runtime, so a deferred import becomes a NameError at class
    # construction. Imports are placed by hand where it matters.
    "TC001",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]
# Qt signals are class attributes that must be camelCase to match the Qt API
# and to read correctly alongside the framework's own signals.
"src/webmonitor/gui/*" = ["N815"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "gui: tests that need a Qt application instance",
    "network: tests that touch the real network (deselected by default)",
]
filterwarnings = ["error::DeprecationWarning:webmonitor.*"]
